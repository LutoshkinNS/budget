services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: budget-server
    container_name: budget_server
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/budget.db}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    volumes:
      - ./apps/server/data:/app/data
    networks:
      - budget-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_TELEGRAM_BOT_NAME: ${VITE_TELEGRAM_BOT_NAME}
    container_name: budget_frontend
    restart: always
    ports:
      - '3001:8080'
    depends_on:
      - server
    networks:
      - budget-network

networks:
  budget-network:
    driver: bridge
